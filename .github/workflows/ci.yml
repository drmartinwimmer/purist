name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Formatting & Lints
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install external check tools (cargo-audit, taplo)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,taplo-cli

      - name: Install Prettier
        run: npm install -g prettier

      - name: Check code formatting (Rust)
        run: cargo fmt --check

      - name: Check Clippy lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run purist AST linter
        run: cargo run -- --path .

      - name: Check TOML formatting (Taplo)
        run: taplo fmt --check

      - name: Check Markdown and JSON formatting (Prettier)
        run: prettier --check "**/*.{md,json}"

      - name: Run cargo security audit
        run: cargo audit

      - name: Verify package & metadata
        run: |
          cargo metadata --format-version 1 --no-deps > /dev/null
          cargo publish --dry-run

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run cargo test
        run: cargo test --all-targets --all-features

  nix:
    name: Nix Flake Check & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Cache Nix builds
        uses: DeterminateSystems/magic-nix-cache-action@v15

      - name: Check Nix flake
        run: nix flake check

      - name: Build Nix package
        run: nix build
